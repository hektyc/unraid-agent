name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version-and-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"

      - name: Read current version
        id: version
        run: |
          CURRENT=$(cat VERSION)
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build Go binary
        run: |
          cd go
          go mod tidy
          go build -o bin/unraid-mcp ./cmd/unraid-mcp
          ls -lh bin/unraid-mcp

      - name: Package .plg
        run: |
          chmod +x build.sh
          ./build.sh
          ls -lh *.plg

      - name: Update version in build.sh
        run: |
          sed -i "s/^VERSION=\".*\"/VERSION=\"${{ steps.version.outputs.new_version }}\"/" build.sh

      - name: Update version in README.md
        run: |
          sed -i "s/unraid-mcp-.*\.plg/unraid-mcp-${{ steps.version.outputs.new_version }}.plg/g" README.md

      - name: Commit and push version bump
        run: |
          git add build.sh README.md VERSION
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }}"
          git tag v${{ steps.version.outputs.new_version }}
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.new_version }}
          name: v${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          files: unraid-mcp-*.plg
