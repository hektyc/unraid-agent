name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"

      - name: Read current version
        id: version
        run: |
          echo "current_version=$(cat VERSION)" >> $GITHUB_OUTPUT

          # CalVer: YYYY.MM.DD, same-day re-releases get .HHMM suffix
          # (numeric-only suffix stays monotonic under both string and
          # PHP version_compare semantics — letter suffixes can compare
          # as pre-release in PHP)
          TODAY=$(date -u +%Y.%m.%d)
          if git tag -l "v${TODAY}" | grep -q .; then
            NEW_VERSION="${TODAY}.$(date -u +%H%M)"
          else
            NEW_VERSION="$TODAY"
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Bump VERSION file
        run: |
          echo "${{ steps.version.outputs.new_version }}" > VERSION
          cat VERSION

      - name: Bump version in .plg
        run: |
          sed -i "s/<!ENTITY version[[:space:]]*\"[^\"]*\"/<!ENTITY version     \"${{ steps.version.outputs.new_version }}\"/" plugin/unraid-agent.plg
          grep "ENTITY version" plugin/unraid-agent.plg

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build Go binary
        run: |
          cd go
          go mod tidy
          go build -ldflags "-X main.version=${{ steps.version.outputs.new_version }} -X github.com/hektyc/unraid-mcp-server/internal/mcp.ServerVersion=${{ steps.version.outputs.new_version }}" -o bin/unraid-agent ./cmd/unraid-agent
          ls -lh bin/unraid-agent

      - name: Package plugin
        run: |
          chmod +x build.sh
          ./build.sh
          ls -lh unraid-agent.tar

      - name: Commit and push version bump
        run: |
          git add VERSION plugin/unraid-agent.plg
          if git diff --cached --quiet; then
            echo "Version files already up to date — skipping commit"
          else
            git commit -m "chore(release): v${{ steps.version.outputs.new_version }}"
          fi
          git tag v${{ steps.version.outputs.new_version }}
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.new_version }}
          name: v${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          files: |
            plugin/unraid-agent.plg
            unraid-agent.tar
