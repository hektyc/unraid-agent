name: Build Unraid Agent Plugin

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build Go binary
        run: |
          cd go
          go mod tidy
          go build -o bin/unraid-agent ./cmd/unraid-agent
          ls -lh bin/unraid-agent

      - name: Package plugin
        run: |
          chmod +x build.sh
          ./build.sh
          ls -lh unraid-agent.tar

      - name: Upload .plg manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: unraid-agent-plg
          path: plugin/unraid-agent.plg
          retention-days: 90

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
           name: unraid-agent-package
           path: unraid-agent.tar
           retention-days: 90


      - name: Upload Go binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: unraid-agent-binary
          path: go/bin/unraid-agent
          retention-days: 90

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            go/*.log
            *.log
          retention-days: 7
